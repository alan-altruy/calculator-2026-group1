name: Validate Release Tag
on:
  push:
    tags:
      - 'v*'   # ne valide que les tags qui commencent par v, ex: v1.0.0

permissions:
  contents: read

jobs:
  validate:
    name: Build & Test on Tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version: 25
          distribution: temurin

      - name: Build, Test & PMD
        run: mvn clean test 